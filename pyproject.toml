[project]
name = "whisper-transcribe"
version = "0.1.0"
description = "Transcription audio/vidéo avec OpenAI Whisper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20231117",
    "rich>=15.0.0",
]

[project.scripts]
transcribe = "whisper_transcribe.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_transcribe"]
